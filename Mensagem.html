<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens - Studio Glimmer</title>
    <link rel="stylesheet" href="css/styles-mensagens.css">
</head>
<body><section class="chat-container">
    <header class="chat-header">
        <div class="header-content">
            <img src="img/Logotipo/icon-br.png" alt="Nosso Salão" class="chat-logo">
            <h2>Studio Glimmer</h2>
        </div>
    </header>
    <div id="chatMessages" class="chat-messages">
        <!-- Mensagens serão adicionadas dinamicamente aqui -->
    </div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Digite uma mensagem...">
        <button id="sendMessageButton">Enviar</button>
    </div>
</section>
    <script src="js/mensagens.js"></script>
</body>
</html>
